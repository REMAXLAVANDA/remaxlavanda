# Panel-app kaynak kodu main'e girince otomatik derleyip panel/ klasörünü
# güncelleyen iş akışı (bkz. AI_NOTLARI.md).
name: Panel otomatik derleme ve yayın

on:
  push:
    branches: [main]
    paths:
      - 'panel-app/src/**'
      - 'panel-app/public/**'
      - 'panel-app/package.json'
      - 'panel-app/package-lock.json'
      - 'panel-app/vite.config.js'
      - 'panel-app/index.html'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v7

      - name: Node kurulumu
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: panel-app/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: panel-app
        run: npm ci

      - name: Testler (vitest)
        working-directory: panel-app
        run: npm run test

      - name: Kod kontrolü (oxlint)
        working-directory: panel-app
        run: npm run lint

      - name: Derle
        working-directory: panel-app
        run: npm run build

      - name: panel/ klasörünü güncelle
        run: |
          rm -rf panel
          cp -r panel-app/dist panel

      - name: Değişiklik varsa commit'le ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panel/
          if git diff --cached --quiet; then
            echo "panel/ zaten güncel, commit atılmadı."
            exit 0
          fi
          git commit -m "Panel otomatik derleme: ${GITHUB_SHA::7} [skip ci]" -m "Bu commit panel-build-deploy.yml iş akışı tarafından otomatik oluşturuldu — kaynak: ${GITHUB_SHA}"
          git push origin HEAD:main
